version: 2

models:
  - name: int_episodes_included
    description: Episodes with excluded series removed. The New Year Treat series are 
          dropped because the source dataset assigns the same cast (contestants) to all 
          episodes and tasks. Also, the episodes and tasks are the same across all new 
          year treat series type, so the data is not useful for analysis.
    columns:
      - name: series_name
        description: The name of the series (known as seasons in the States) in which the episode appeared.
        data_tests:
          - not_null
      - name: episode_number
        description: The number of the episode within the series.
        data_tests:
          - not_null
      - name: episode_title
        description: The title of the episode.
        data_tests:
          - not_null

  - name: int_episode_contestant_points_included
    description: Contestant points with excluded series removed as it reads from int_episodes_included.
    columns:
      - name: series_name
        description: The name of the series (known as seasons in the States) in which the episode appeared.
        data_tests:
          - not_null
      - name: episode_number
        description: The number of the episode within the series.
        data_tests:
          - not_null
      - name: episode_title
        description: The title of the episode.
        data_tests:
          - not_null
      - name: contestant_name
        description: The name of the contestant.
        data_tests:
          - not_null
      - name: episode_points
        description: Final score recorded for a contestant in an episode. Includes task points and any additional points awarded outside individual tasks.

  - name: int_series_included
    description: Series with excluded series removed. The New Year Treat series are 
          dropped because the source dataset assigns the same cast (contestants) to all 
          episodes and tasks. Also, the episodes and tasks are the same across all new 
          year treat series type, so the data is not useful for analysis.
    columns:
      - name: series_name
        description: The name of the series.
        data_tests:
          - not_null
      - name: series_kind
        description: The kind of series (e.g., "regular", "special", etc.).
      - name: series_air_date_range
        description: The range of air dates for the series.
      - name: number_of_episodes
        description: The total number of episodes in the series.
        
  - name: int_task_points_included
    description: Task points with excluded series removed. The New Year Treat series are 
          dropped because the source dataset assigns the same cast (contestants) to all 
          episodes and tasks. Also, the episodes and tasks are the same across all new 
          year treat series type, so the data is not useful for analysis.
    columns:
      - name: task_id
        description: The original ID of the task from the source data.
        data_tests:
          - not_null
      - name: series_name
        description: The name of the series in which the task appeared.
        data_tests:
          - not_null
      - name: episode_number
        description: The number of the episode in which the task appeared.
        data_tests:
          - not_null
      - name: episode_title
        description: The title of the episode in which the task appeared.
        data_tests:
          - not_null
      - name: task_label
        description: The label (T for tiebreaker) or number of the task within the episode.
        data_tests:
          - not_null
      - name: is_prize
        description: Indicates whether the task was a prize task (true/false).
      - name: is_live
        description: Indicates whether the task was performed live (true/false).
      - name: is_tiebreak
        description: Indicates whether the task was a tiebreaker (true/false).
      - name: contestant_name
        description: The name of the contestant who performed the task.

  - name: int_tasks_included
    description: Tasks with excluded series removed. The New Year Treat series are 
          dropped because the source dataset assigns the same cast (contestants) to all 
          episodes and tasks. Also, the episodes and tasks are the same across all new 
          year treat series type, so the data is not useful for analysis.
    columns:
      - name: task_id
        description: The original ID of the task from the source data.
        data_tests:
          - not_null
      - name: series_name
        description: The name of the series in which the task appeared.
        data_tests:
          - not_null
      - name: episode_number
        description: The number of the episode in which the task appeared.
        data_tests:
          - not_null
      - name: episode_title
        description: The title of the episode in which the task appeared.
        data_tests:
          - not_null
      - name: task_label
        description: The label (T for tiebreaker) or number of the task within the episode.
        data_tests:
          - not_null
      - name: is_prize
        description: Indicates whether the task was a prize task (true/false).
      - name: is_live
        description: Indicates whether the task was performed live (true/false).
      - name: is_tiebreak
        description: Indicates whether the task was a tiebreaker (true/false).
      - name: task_description
        description: A brief description of what the task entailed.
