version: 2

models:
  - name: int_episodes_included
    description: "Episodes with excluded series removed. {{ doc('excluded_series') }}"
    columns:
      - name: series_name
        description: Name of the series (called a season in the US).
        data_tests: [not_null]
      - name: episode_number
        description: Number of the episode within the series.
        data_tests: [not_null]
      - name: episode_title
        description: Title of the episode.
        data_tests: [not_null]

  - name: int_series_included
    description: "Series with excluded series removed. {{ doc('excluded_series') }}"
    columns:
      - name: series_name
        data_tests: [unique, not_null]
      - name: series_kind
        description: Kind of series from the source (series or special).

  - name: int_tasks_included
    description: "Tasks with excluded series removed. {{ doc('excluded_series') }}"
    columns:
      - name: task_id
        description: Task ID from the source data.
        data_tests: [unique, not_null]
      - name: series_name
        data_tests: [not_null]
      - name: episode_number
        data_tests: [not_null]
      - name: task_label
        description: Task number within the episode, or T for a tiebreak task.
        data_tests: [not_null]
      - name: is_prize
        description: True for the prize task, which opens the episode and counts toward totals.
      - name: is_live
        description: True if the task was performed live.
      - name: is_tiebreak
        description: True for a tiebreak task. Tiebreak results are not part of episode totals.

  - name: int_task_points_included
    description: "Task points with excluded series removed. {{ doc('excluded_series') }}"
    columns:
      - name: task_id
        data_tests: [not_null]
      - name: series_name
        data_tests: [not_null]
      - name: episode_number
        data_tests: [not_null]
      - name: contestant_name
        data_tests: [not_null]
      - name: task_points
        description: Score for a normal task; a 1/0 result for a tiebreak task. Null if the contestant did not take part.

  - name: int_episode_contestant_points
    description: >
      Official episode points per contestant per episode, unpacked from the episodes file
      (names and totals are both stored in seat order). Built from int_episodes_included, so
      excluded series are already removed.
    columns:
      - name: series_name
        data_tests: [not_null]
      - name: episode_number
        data_tests: [not_null]
      - name: contestant_name
        data_tests: [not_null]
      - name: contestant_seat_position
        description: Position of the contestant in the seat-order list (1 to 5).
        data_tests: [not_null]
      - name: episode_points
        description: Official total for the contestant in the episode, as printed in the broadcast tables.
        data_tests: [not_null]
