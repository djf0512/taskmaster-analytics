version: 2

models:
  - name: dim_contestant
    description: One row per contestant, with a unique key and cleaned name.
    columns:
      - name: contestant_key
        description: A unique key for each contestant, generated from their name.
        data_tests:
          - unique
          - not_null
      - name: contestant_name
        description: The name of the contestant.
        data_tests:
          - not_null

  - name: dim_episodes
    description: One row per episode, with a unique key and cleaned attributes. 
    columns:
      - name: episode_key
        description: A unique key for each episode, generated from its series name and episode number.
        data_tests:
          - unique
          - not_null
      - name: series_key
        description: A unique key for each series, generated from its name.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_series')
                field: series_key
      - name: series_name
        description: The name of the series in which the episode appeared.
      - name: episode_number
        description: The number of the episode within the series.
      - name: episode_title
        description: The title of the episode.
      - name: air_date
        description: The date on which the episode aired.

  - name: dim_series
    description: One row per series (known as seasons in the States), with a unique key and cleaned name.
    columns:
      - name: series_key
        description: A unique key for each series, generated from its name.
        data_tests:
          - unique
          - not_null
      - name: series_name
        description: The name of the series.
        data_tests:
          - not_null

  - name: dim_task
    description: One row per task, with a unique key and cleaned attributes.
    columns:
      - name: task_id
        description: The original ID of the task from the source data.
        data_tests:
          - not_null
      - name: series_name
        description: The name of the series in which the task appeared.
        data_tests:
          - not_null
      - name: episode_number
        description: The number of the episode in which the task appeared.
        data_tests:
          - not_null
      - name: episode_title
        description: The title of the episode in which the task appeared.
        data_tests:
          - not_null
      - name: task_label
        description: The label or number of the task within the episode.
        data_tests:
          - not_null
      - name: is_prize
        description: Indicates whether the task was a prize task (true/false).
      - name: is_live
        description: Indicates whether the task was performed live (true/false).
      - name: is_tiebreak
        description: Indicates whether the task was a tiebreaker (true/false).

  - name: fct_series_score
    description: One row per contestant per series. Keys and points only; descriptive attributes live in the dimension tables.
    columns:
      - name: contestant_key
        description: A unique key for each contestant, generated from their name.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_contestant')
                field: contestant_key
      - name: series_key
        description: A unique key for each series, generated from its name.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_series')
                field: series_key
      - name: total_points
        description: The total number of points scored by the contestant in the series.
      - name: is_winner
        description: Indicates whether the contestant won the series (true/false).

  - name: fct_task_score
    description: One row per contestant per task. Keys and points only; descriptive attributes live in the dimension tables.
    columns:
      - name: contestant_key
        description: A unique key for each contestant, generated from their name.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_contestant')
                field: contestant_key
      - name: task_id
        description: The original ID of the task from the source data.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_task')
                field: task_id
      - name: series_key
        description: A unique key for each series, generated from its name.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_series')
                field: series_key
      - name: episode_key
        description: A unique key for each episode, generated from its series name and episode number.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_episodes')
                field: episode_key
      - name: points
        description: The number of points scored by the contestant for this task.
      - name: tiebreak_results
        description: The results of the tiebreaker for this task, if applicable.
