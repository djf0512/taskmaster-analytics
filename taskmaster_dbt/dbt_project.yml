name: 'taskmaster_dbt'
version: '1.0.0'

# Connection settings live in profiles.yml (in this folder).
profile: 'taskmaster_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Each layer builds into its own schema (see macros/generate_schema_name.sql).
models:
  taskmaster_dbt:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts